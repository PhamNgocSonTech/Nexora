services:
  postgres:
    image: postgres:16-alpine
    container_name: nexora-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: nexora_dev_pw
      POSTGRES_DB: nexora
    ports:
      - '5433:5432'
    volumes:
      - nexora_pgdata:/var/lib/postgresql/data

volumes:
  nexora_pgdata:
